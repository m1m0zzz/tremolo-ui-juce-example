name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run build

  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install dependencies for Ubuntu
        # https://github.com/juce-framework/JUCE/blob/master/docs/Linux%20Dependencies.md
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Install WebView2 for Windows
        # NEEDS_WEBVIEW2 links WebView2 statically, and JUCE looks for this NuGet package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/nuget"
          nuget install Microsoft.Web.WebView2 -Version 1.0.4258.31 -OutputDirectory "$dir"
          echo "EXTRA_CMAKE_ARGS=-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$dir" >> "$GITHUB_ENV"

      - name: Set macOS deployment target
        # Without it the runner's macOS becomes the target, and APIs removed in the newer SDK fail to build.
        # CMake reads CMAKE_OSX_DEPLOYMENT_TARGET from it, and the juceaide build of JUCE inherits it.
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA_CMAKE_ARGS

      - name: Build
        run: cmake --build build --config Release --parallel
